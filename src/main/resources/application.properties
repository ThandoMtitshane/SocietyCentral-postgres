spring.application.name=SocietyCentral

# ── Server ────────────────────────────────────────────────────────────────────
# Render injects the port to bind to via the PORT env var; default 8080 locally.
server.port=${PORT:8080}

# ── Datasource (PostgreSQL) ──────────────────────────────────────────────────
# On Render, set SPRING_DATASOURCE_URL / USERNAME / PASSWORD from the managed
# Postgres instance. Defaults point at a local Postgres for development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/societycentral}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate manages the schema from the JPA entities (create-and-update).
# This avoids hand-porting the full T-SQL DDL; seed data is applied separately.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT Configuration ─────────────────────────────────────────────────────────
# Set JWT_SECRET as an environment variable in production.
jwt.secret=${JWT_SECRET:Z0l4VnJzN3daTRXh5Rk9JdTlkc3VJZ0NnWjBvT2h0N1R5Y1FQYlN4Z2VNbXJQd0l4T0VhWmY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Public base URL of the deployed frontend (used in email links, etc.).
app.base-url=${APP_BASE_URL:http://localhost:5173}

# ── Resend Email Service ──────────────────────────────────────────────────────
# Set RESEND_API_KEY as an environment variable in production.
resend.api.key=${RESEND_API_KEY:}
resend.from.address=${RESEND_FROM_ADDRESS:noreply@societycentral.uk}
resend.from.name=${RESEND_FROM_NAME:SocietyCentral}

# ── File uploads / media ──────────────────────────────────────────────────────
# NOTE: Render's free tier filesystem is ephemeral — uploaded media is lost on
# restart/redeploy. Fine for a demo; use object storage for production.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
societycentral.upload-dir=${SOCIETYCENTRAL_UPLOAD_DIR:uploads/events}
societycentral.media-base-url=${SOCIETYCENTRAL_MEDIA_BASE_URL:http://localhost:8080}
